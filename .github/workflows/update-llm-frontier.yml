name: Update LLM cost frontier data

on:
  schedule:
    # Mondays at 13:00 UTC (09:00 US Eastern)
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data from Artificial Analysis
        run: python3 scripts/update_llm_frontier.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/llm-frontier/history.json public/data/llm-frontier.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update LLM cost frontier data ($(date -u +%Y-%m-%d))"
            git push
          fi
