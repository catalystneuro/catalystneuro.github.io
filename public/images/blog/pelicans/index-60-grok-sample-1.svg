<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky and ground -->
  <rect width="400" height="300" fill="#87CEEB"/>
  <rect x="0" y="255" width="400" height="45" fill="#32CD32"/>
  
  <!-- Bicycle frame -->
  <g stroke="#222" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="80" y1="230" x2="150" y2="235"/>
    <line x1="80" y1="230" x2="160" y2="145"/>
    <line x1="150" y1="235" x2="160" y2="145"/>
    <line x1="150" y1="235" x2="240" y2="135"/>
    <line x1="160" y1="145" x2="240" y2="135"/>
    <line x1="240" y1="135" x2="280" y2="230"/>
  </g>
  
  <!-- Seat -->
  <rect x="145" y="135" width="30" height="8" rx="3" fill="#8B4513"/>
  
  <!-- Handlebars -->
  <line x1="220" y1="125" x2="260" y2="125" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="240" y1="125" x2="240" y2="135" stroke="#222" stroke-width="5"/>
  
  <!-- Cranks and pedal -->
  <line x1="150" y1="235" x2="130" y2="255" stroke="#222" stroke-width="4"/>
  <rect x="120" y="250" width="20" height="6" rx="2" fill="#333"/>
  <line x1="150" y1="235" x2="165" y2="215" stroke="#222" stroke-width="4"/>
  
  <!-- Wheels -->
  <circle cx="80" cy="230" r="35" fill="#ddd" stroke="#333" stroke-width="6"/>
  <circle cx="80" cy="230" r="8" fill="#333"/>
  <g stroke="#666" stroke-width="2">
    <line x1="80" y1="195" x2="80" y2="265"/>
    <line x1="45" y1="230" x2="115" y2="230"/>
    <line x1="55" y1="205" x2="105" y2="255"/>
    <line x1="55" y1="255" x2="105" y2="205"/>
  </g>
  <circle cx="280" cy="230" r="35" fill="#ddd" stroke="#333" stroke-width="6"/>
  <circle cx="280" cy="230" r="8" fill="#333"/>
  <g stroke="#666" stroke-width="2">
    <line x1="280" y1="195" x2="280" y2="265"/>
    <line x1="245" y1="230" x2="315" y2="230"/>
    <line x1="255" y1="205" x2="305" y2="255"/>
    <line x1="255" y1="255" x2="305" y2="205"/>
  </g>
  
  <!-- Pelican -->
  <!-- Rear wing -->
  <ellipse cx="130" cy="95" rx="30" ry="20" fill="#e8e8e8" transform="rotate(20 130 95)"/>
  <!-- Body -->
  <ellipse cx="165" cy="105" rx="50" ry="40" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  <!-- Neck -->
  <ellipse cx="185" cy="90" rx="25" ry="18" fill="#f5f5f5" stroke="#ddd" stroke-width="1" transform="rotate(-30 185 90)"/>
  <!-- Head -->
  <circle cx="205" cy="75" r="22" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="215" cy="70" r="4" fill="#000"/>
  <circle cx="216" cy="69" r="1.5" fill="#fff"/>
  <!-- Beak and pouch -->
  <path d="M220 75 L280 70 L285 85 Q260 130 225 95 Z" fill="#FFA500" stroke="#E68A00" stroke-width="1"/>
  <!-- Wing holding handlebar -->
  <path d="M180 90 Q210 105 240 125" stroke="#f5f5f5" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="155" y1="140" x2="130" y2="253" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
  <line x1="170" y1="140" x2="165" y2="215" stroke="#FFD700" stroke-width="6" stroke-linecap="round"/>
</svg>