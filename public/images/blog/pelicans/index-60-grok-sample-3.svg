<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <!-- Sky -->
  <rect width="400" height="250" fill="#87CEEB"/>
  <!-- Grass -->
  <rect y="250" width="400" height="30" fill="#7CFC00"/>
  
  <!-- Bicycle wheels -->
  <circle cx="85" cy="210" r="42" fill="none" stroke="#222" stroke-width="10"/>
  <circle cx="85" cy="210" r="6" fill="#444"/>
  <line x1="85" y1="168" x2="85" y2="252" stroke="#555" stroke-width="2"/>
  <line x1="43" y1="210" x2="127" y2="210" stroke="#555" stroke-width="2"/>
  <line x1="55" y1="180" x2="115" y2="240" stroke="#555" stroke-width="2"/>
  <line x1="55" y1="240" x2="115" y2="180" stroke="#555" stroke-width="2"/>
  
  <circle cx="275" cy="210" r="42" fill="none" stroke="#222" stroke-width="10"/>
  <circle cx="275" cy="210" r="6" fill="#444"/>
  <line x1="275" y1="168" x2="275" y2="252" stroke="#555" stroke-width="2"/>
  <line x1="233" y1="210" x2="317" y2="210" stroke="#555" stroke-width="2"/>
  <line x1="245" y1="180" x2="305" y2="240" stroke="#555" stroke-width="2"/>
  <line x1="245" y1="240" x2="305" y2="180" stroke="#555" stroke-width="2"/>
  
  <!-- Bicycle frame -->
  <g stroke="#333" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="85" y1="210" x2="165" y2="210"/> <!-- chainstay -->
    <line x1="85" y1="210" x2="105" y2="125"/> <!-- seatstay -->
    <line x1="165" y1="210" x2="105" y2="125"/> <!-- seattube -->
    <line x1="165" y1="210" x2="245" y2="120"/> <!-- downtube -->
    <line x1="105" y1="125" x2="245" y2="120"/> <!-- toptube -->
    <line x1="245" y1="120" x2="275" y2="210"/> <!-- fork -->
  </g>
  
  <!-- Seat -->
  <ellipse cx="105" cy="122" rx="18" ry="6" fill="#222"/>
  
  <!-- Handlebars -->
  <line x1="245" y1="120" x2="245" y2="105" stroke="#333" stroke-width="5"/>
  <line x1="220" y1="102" x2="270" y2="102" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <circle cx="222" cy="102" r="5" fill="#555"/>
  <circle cx="268" cy="102" r="5" fill="#555"/>
  
  <!-- Crank and pedals -->
  <circle cx="165" cy="210" r="8" fill="#333"/>
  <line x1="145" y1="228" x2="185" y2="192" stroke="#222" stroke-width="4" stroke-linecap="round"/>
  <rect x="138" y="224" width="14" height="8" rx="2" fill="#444"/>
  <rect x="178" y="188" width="14" height="8" rx="2" fill="#444"/>
  
  <!-- Pelican body -->
  <ellipse cx="135" cy="88" rx="58" ry="32" fill="#FFFAF0" stroke="#DDD" stroke-width="1"/>
  <!-- Tail -->
  <path d="M80,95 Q70,85 75,75 Q90,88 80,95" fill="#F5F5DC"/>
  
  <!-- Neck and head -->
  <ellipse cx="175" cy="68" rx="18" ry="22" fill="#FFFAF0"/>
  <circle cx="192" cy="58" r="20" fill="#FFFAF0"/>
  
  <!-- Beak with pouch -->
  <path d="M208,50 L268,62 Q282,85 255,98 L210,78 Q200,62 208,50 Z" fill="#FF8C00" stroke="#E67E22" stroke-width="1"/>
  <path d="M215,72 Q240,92 258,80" fill="none" stroke="#CC7000" stroke-width="1.5"/>
  
  <!-- Eye -->
  <circle cx="198" cy="52" r="4" fill="#111"/>
  <circle cx="199.5" cy="50.5" r="1.5" fill="white"/>
  
  <!-- Wing (holding handlebar) -->
  <path d="M155,75 Q200,40 248,100 Q210,85 160,90 Z" fill="#F5F5DC" stroke="#DDD" stroke-width="1"/>
  
  <!-- Other wing (folded) -->
  <ellipse cx="115" cy="80" rx="25" ry="15" fill="#EEE8AA" transform="rotate(-20 115 80)"/>
  
  <!-- Legs -->
  <g stroke="#DAA520" stroke-width="4" stroke-linecap="round">
    <line x1="115" y1="115" x2="145" y2="228"/>
    <line x1="145" y1="115" x2="185" y2="192"/>
  </g>
  <!-- Webbed feet hints -->
  <path d="M140,228 Q145,235 152,228" fill="none" stroke="#DAA520" stroke-width="3"/>
  <path d="M180,192 Q185,199 192,192" fill="none" stroke="#DAA520" stroke-width="3"/>
</svg>